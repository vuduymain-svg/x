name: Android Gradle Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Decode or generate debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pksp.incremental=false \
            -Djava.awt.headless=true \
            -Dorg.gradle.jvmargs="-Xmx4g -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pksp.incremental=false \
            -Djava.awt.headless=true \
            -Dorg.gradle.jvmargs="-Xmx4g -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: path-of-champions-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Release APK (when signing secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${STORE_PASSWORD}" ] && [ -n "${KEY_PASSWORD}" ]; then
            export KEYSTORE_PATH="${{ github.workspace }}/release-upload-key.jks"
            echo "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
            gradle assembleRelease \
              --no-daemon \
              --no-configuration-cache \
              --no-build-cache \
              --max-workers=2 \
              -Pkotlin.compiler.execution.strategy=in-process \
              -Pksp.incremental=false \
              -Djava.awt.headless=true \
              -Dorg.gradle.jvmargs="-Xmx4g -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
              --stacktrace
          else
            echo "Release signing secrets not set; skipping release APK build."
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: path-of-champions-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Attach APK to GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
